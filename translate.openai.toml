# Ready-to-use OpenAI config for cross-provider smoke tests.
# Requires OPENAI_API_KEY in translate_v3/.env (main.py auto-loads .env
# via python-dotenv).
#
# OpenAI-specific notes:
# - Prompt caching: OpenAI has automatic caching (no cache_control markers
#   needed), but LangChain doesn't surface hit/miss metrics for it. Our
#   apply_prompt_cache() returns a plain string for non-Anthropic providers,
#   so no code-level caching is applied — OpenAI's server-side caching is
#   still active silently.
# - Adaptive thinking: not supported. Use `reasoning_effort` below to dial
#   GPT-5 family reasoning depth.
# - tool_choice: bundle sends "required" (OpenAI's spelling of "any").
#   bundle.forces_tool_call = True — sentinel exit is primary.

[llm]
provider = "openai"
# gpt-5-mini — cheap and fast, good for smoke tests. Alternatives:
# - "gpt-5"           — full frontier model; ~5-10x cost, best quality
# - "gpt-4o-mini"     — older, cheapest option (~$0.05-0.15 for fast-uuid)
model = "gpt-5-mini"
temperature = 0.0
max_tokens = 64000              # OpenAI has smaller per-response caps than Anthropic
# reasoning_effort = "medium"   # GPT-5 only: "minimal" | "low" | "medium" | "high"
# base_url = "https://openrouter.ai/api/v1"  # or LM Studio / vLLM / OpenRouter — see translate.lmstudio.toml

[agent]
max_wall_seconds = 10800
max_tool_calls = 500

[langfuse]
enabled = true