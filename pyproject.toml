[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "translate-v3"
version = "0.1.0"
description = "Agentic Java-to-Elixir source translator using the Anthropic API."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.120.0",
  "pydantic>=2.0.0",
  "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
translate = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agent*", "project*", "language*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
